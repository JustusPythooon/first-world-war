<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oberkommando 1914</title><link rel="stylesheet" href="simulation.css"></head><body><script>if(localStorage.historyEscapeUnlocked!=='true'){alert('Oberkommando 1914 wird nach allen 25 Escape-Akten freigeschaltet.');location.replace('index.html');}</script><div id="sim"><header><button onclick="location.href='index.html'">← LERNZENTRALE</button><div><b>OBERKOMMANDO 1914</b><small>HISTORISCHE MANAGEMENT-SIMULATION</small></div><div class="date" id="date"></div></header><main><section class="map"><img id="mapImage" src="assets/europa1914.png"><div class="front f1">WESTFRONT <b id="westUnit">76</b></div><div class="front f2">OSTFRONT <b id="eastUnit">68</b></div><div class="front f3">HEIMAT <b id="homeUnit">72</b></div><div class="supplyline l1"></div><div class="supplyline l2"></div><div class="overlay"><span>STRATEGISCHE LAGE</span><strong id="situation">ANGESpannt</strong></div></section><aside><div class="tabs"><button class="active" data-tab="command">KOMMANDO</button><button data-tab="army">ARMEE</button><button data-tab="log">CHRONIK</button></div><div id="command" class="panel active"><div class="headline"><label id="turnLabel"></label><h1 id="eventTitle"></h1><p id="eventText"></p></div><div id="choices"></div><div id="outcome"></div></div><div id="army" class="panel"><h2>RESSOURCEN VERTEILEN</h2><p>Verteile Transportkapazität. Die Summe darf höchstens 100 betragen.</p><div id="alloc"></div><button class="confirm" onclick="applyAllocation()">VERTEILUNG BESTÄTIGEN</button><div id="allocMsg"></div></div><div id="log" class="panel"><h2>KRIEGSCHRONIK</h2><div id="logList"></div></div></aside></main><section class="stats" id="stats"></section><footer><span>ZIEL: FRONT, VERSORGUNG UND BEVÖLKERUNG GLEICHZEITIG STABIL HALTEN</span><button onclick="resetGame()">NEUE KAMPAGNE</button></footer></div><div id="end" class="end"><div><label>KAMPA
